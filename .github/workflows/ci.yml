name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install Vulkan loader, Mesa lavapipe, and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 vulkan-tools mesa-vulkan-drivers ffmpeg

      - name: Locate lavapipe ICD and export VK_ICD_FILENAMES
        run: |
          icd=$(sudo find /usr /etc -name 'lvp_icd*.json' 2>/dev/null | head -n1)
          test -n "$icd" || { echo "lavapipe ICD JSON not found"; exit 1; }
          echo "Found lavapipe ICD at $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Verify Vulkan loader sees lavapipe
        run: vulkaninfo --summary | head -30

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Miri toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      - name: Miri test
        run: cargo +nightly miri test -p rotorlab-ga --lib
