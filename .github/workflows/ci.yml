name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy, rustfmt

      - name: Install C++ toolchain (for fixture generation)
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Build Cayley fixture
        run: |
          cd rotorlab-ga/tests/fixtures
          make

      - name: Cargo build
        run: cargo build --release --workspace

      - name: Cargo test
        run: cargo test --release --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo doc
        run: cargo doc --workspace --no-deps

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Miri toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri test
        run: cargo +nightly miri test -p rotorlab-ga --lib
