[workspace]
resolver = "3"
members = ["rotorlab-ga", "rotorlab"]

[workspace.package]
# Crate versions are set explicitly in each crate's Cargo.toml so that
# rotorlab-ga and rotorlab can ship on independent semver tracks.
edition       = "2024"
rust-version  = "1.85"
authors       = ["Alejandro Soto Franco <sotofranco.eng@gmail.com>"]
license       = "Apache-2.0"
repository    = "https://github.com/alejandro-soto-franco/rotorlab"
homepage      = "https://github.com/alejandro-soto-franco/rotorlab"

[workspace.dependencies]
bytemuck    = { version = "1", features = ["derive"] }
log         = "0.4"
thiserror   = { version = "2", default-features = false, features = ["std"] }
proptest    = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
ash         = { version = "0.38", default-features = false, features = ["loaded"] }
shaderc     = "0.9"
image       = { version = "0.25", default-features = false, features = ["png"] }
tempfile    = "3"

[workspace.lints.rust]
missing_docs           = "warn"
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub        = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc         = "warn"
ptr_as_ptr                 = "warn"
ref_as_ptr                 = "warn"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 4
